<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Founder vs Scale Diagnostic</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1, h2 { text-align: center; }
    .question { margin: 15px 0; }
    label { display: block; margin-bottom: 5px; }
    .submit-btn { margin-top: 20px; display: block; text-align: center; }
    canvas { display: block; margin: 40px auto; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Founder vs Scale Diagnostic Survey</h1>
  <form id="survey">
    <div id="questions"></div>
    <div class="submit-btn">
      <button type="submit">Submit</button>
    </div>
  </form>

  <canvas id="plot" width="400" height="400"></canvas>

  <script>
    const questions = [
      // Founder’s Mentality
      "Everyone in the organization can articulate our mission clearly and passionately.",
      "Teams feel a deep personal ownership over results.",
      "Our front-line staff are empowered to make decisions and solve problems quickly.",
      "We make decisions quickly and act on them without unnecessary layers.",
      "We prioritize customer needs above internal processes or politics.",
      "Our culture values learning, experimentation, and embracing change.",
      // Scale
      "We have the assets and resources to out-invest most of our competitors.",
      "Our systems and processes are scalable and repeatable.",
      "We attract top talent due to our market position and stability.",
      "We have a strong portfolio or customer base that provides resilience.",
      "Our organization can execute large, complex initiatives consistently well.",
      "We benefit from our scale in terms of cost advantage, brand recognition, or influence."
    ];

    const formEl = document.getElementById('questions');
    questions.forEach((text, i) => {
      const div = document.createElement('div');
      div.className = 'question';
      div.innerHTML = `<label>Q${i + 1}. ${text}</label>` +
        `<input type="range" min="1" max="5" value="3" name="q${i + 1}" />`;
      formEl.appendChild(div);
    });

    document.getElementById('survey').addEventListener('submit', function(e) {
      e.preventDefault();
      const data = new FormData(e.target);
      let founderScore = 0, scaleScore = 0;

      for (let i = 1; i <= 12; i++) {
        const val = parseInt(data.get(`q${i}`));
        if (i <= 6) founderScore += val;
        else scaleScore += val;
      }

      const normFounder = (founderScore / 30) * 100;
      const normScale = (scaleScore / 30) * 100;

      drawPlot(normScale, normFounder);
    });

    function drawPlot(x, y) {
      const canvas = document.getElementById('plot');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 400, 400);

      // Axes
      ctx.beginPath();
      ctx.moveTo(200, 0);
      ctx.lineTo(200, 400);
      ctx.moveTo(0, 200);
      ctx.lineTo(400, 200);
      ctx.strokeStyle = '#888';
      ctx.stroke();

      // Labels for axes
      ctx.font = "12px Arial";
      ctx.fillText("Low Founder’s Mentality", 10, 190);
      ctx.fillText("High Founder’s Mentality", 10, 20);
      ctx.fillText("Low Scale", 10, 390);
      ctx.fillText("High Scale", 300, 390);

      // Quadrant labels
      ctx.font = "bold 14px Arial";
      ctx.fillStyle = "#000";
      ctx.fillText("Struggling Bureaucracies", 20, 370);
      ctx.fillText("Great Repeatable Models", 220, 30);
      ctx.fillText("Insurgents", 20, 30);
      ctx.fillText("Slow-moving Incumbents", 220, 370);

      // Plot point
      const px = x * 2;
      const py = 400 - (y * 2);
      ctx.beginPath();
      ctx.arc(px, py, 6, 0, Math.PI * 2);
      ctx.fillStyle = "red";
      ctx.fill();
    }
  </script>
</body>
</html>

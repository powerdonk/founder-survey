
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Founder vs Scale Survey (Simple Version)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .question { margin: 15px 0; }
    .radio-scale { display: flex; justify-content: space-between; width: 400px; margin: auto; }
    .radio-scale label { text-align: center; font-size: 12px; }
    .canvas-wrapper { text-align: center; margin-top: 30px; }
  </style>
</head>
<body>
  <h1>Founder vs Scale Diagnostic</h1>
  <form id="survey">
    <label>Name: <input type="text" id="name" required></label>
    <div id="questions"></div>
    <br>
    <button type="submit">Submit</button>
  </form>

  <div class="canvas-wrapper">
    <canvas id="plot" width="400" height="400" style="border:1px solid #ccc;"></canvas>
    <div><strong>Scale (X) vs Founder’s Mentality (Y)</strong></div>
  </div>

  <script>
    const avgScale = 62.4;
    const avgFounder = 65.5;

    const questions = [
      "Everyone in the organization can articulate our mission clearly and passionately.",
      "Teams feel a deep personal ownership over results.",
      "Our front-line staff are empowered to make decisions and solve problems quickly.",
      "We make decisions quickly and act on them without unnecessary layers.",
      "We prioritize customer needs above internal processes or politics.",
      "Our culture values learning, experimentation, and embracing change.",
      "We have the assets and resources to out-invest most of our competitors.",
      "Our systems and processes are scalable and repeatable.",
      "We attract top talent due to our market position and stability.",
      "We have a strong portfolio or customer base that provides resilience.",
      "Our organization can execute large, complex initiatives consistently well.",
      "We benefit from our scale in terms of cost advantage, brand recognition, or influence."
    ];

    const container = document.getElementById("questions");
    questions.forEach(function(text, i) {
      const div = document.createElement("div");
      div.className = "question";
      let html = "<label>Q" + (i+1) + ". " + text + "</label><br>";
      for (let j = 1; j <= 7; j++) {
        html += "<label><input type='radio' name='q" + (i+1) + "' value='" + j + "' required> " + j + "</label> ";
      }
      div.innerHTML = html;
      container.appendChild(div);
    });

    document.getElementById("survey").addEventListener("submit", function(e) {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const responses = [];
      let founderScore = 0, scaleScore = 0;

      try {
        for (let i = 1; i <= 12; i++) {
          const val = parseInt(document.querySelector("input[name='q" + i + "']:checked").value);
          responses.push(val);
          if (i <= 6) founderScore += val;
          else scaleScore += val;
        }
      } catch (err) {
        alert("Please answer all questions.");
        return;
      }

      const normFounder = (founderScore / 42) * 100;
      const normScale = (scaleScore / 42) * 100;

      fetch("https://script.google.com/macros/s/AKfycbzcX3C8CEhd8OlWlp_ocKHzHBYrw-qVS-NGXFkNcvXsnKKqGzXyyVnO1rxZWsRSWewH/exec", {
        method: "POST",
        body: JSON.stringify({ name, responses, founderScore, scaleScore }),
        headers: { "Content-Type": "application/json" }
      }).then(res => {
        alert(res.ok ? "Thank you! Your response was submitted." : "Submission failed.");
      }).catch(() => {
        alert("Network error while submitting.");
      });

      drawPlot(normScale, normFounder, avgScale, avgFounder);
    });

    function drawPlot(x, y, orgX, orgY) {
      const ctx = document.getElementById("plot").getContext("2d");
      ctx.clearRect(0, 0, 400, 400);
      ctx.beginPath();
      ctx.moveTo(200, 0); ctx.lineTo(200, 400);
      ctx.moveTo(0, 200); ctx.lineTo(400, 200);
      ctx.strokeStyle = "#aaa"; ctx.stroke();

      ctx.fillStyle = "red";
      ctx.beginPath(); ctx.arc(x * 4, 400 - y * 4, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillText("You", x * 4 + 8, 400 - y * 4);

      ctx.fillStyle = "blue";
      ctx.beginPath(); ctx.arc(orgX * 4, 400 - orgY * 4, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillText("Org Avg", orgX * 4 + 8, 400 - orgY * 4);
    }
  </script>
</body>
</html>
